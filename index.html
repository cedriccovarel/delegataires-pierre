<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Délégataires à la pierre</title>
<link rel="icon" href="assets/prestaterre_logo_green.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css?v=1.0.0">
</head>
<body>
<div id="map" aria-label="Carte de France : clic droit (ou appui long) sur un point pour l'analyser"></div>

<header class="bar">
  <img src="assets/prestaterre_logo_green.png" alt="Prestaterre Certifications" class="logo">
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <label for="q" class="sr">Adresse</label>
    <input id="q" type="search" placeholder="Adresse, commune…" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false">
    <ul id="sugg" role="listbox" hidden></ul>
  </form>
  <span class="data" id="dataState" role="status"></span>
</header>

<aside class="side" id="side" aria-label="Délégataire des aides à la pierre" hidden>
  <button class="close" id="closeSide" type="button" aria-label="Fermer">×</button>
  <div id="sideBody"></div>
</aside>

<dialog id="keyDlg" class="key">
  <form method="dialog" id="keyForm">
    <h2>Clé d’accès</h2>
    <p>La liste des délégataires est privée. Saisis la clé d’accès : elle reste en mémoire de cet onglet et n’est envoyée qu’au script Google du classeur.</p>
    <input id="keyInput" type="password" autocomplete="off" spellcheck="false" minlength="16" required aria-label="Clé d’accès">
    <p class="err" id="keyErr" role="alert"></p>
    <div class="row"><button type="button" class="ghost" id="keyLater">Plus tard</button><button type="submit" id="keyOk">Charger les délégataires</button></div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js?v=1.0.0"></script>
</body>
</html>
